<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServerPilot Control Panel</title>
  <meta name="description" content="Production-Grade Ubuntu Server Control Panel & Deployment Engine">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-icon">S</div>
        <div class="brand-title">ServerPilot</div>
      </div>
      <ul class="nav-list">
        <li class="nav-item active"><a href="#/dashboard"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li class="nav-item"><a href="#/projects"><span class="nav-icon">🚀</span> Projects</a></li>
        <li class="nav-item"><a href="#/services"><span class="nav-icon">⚙️</span> Services</a></li>
        <li class="nav-item"><a href="#/deployments"><span class="nav-icon">📦</span> Deployments</a></li>
        <li class="nav-item"><a href="#/terminal"><span class="nav-icon">💻</span> Terminal</a></li>
        <li class="nav-item"><a href="#/logs"><span class="nav-icon">📜</span> Logs</a></li>
        <li class="nav-item"><a href="#/domains"><span class="nav-icon">🌐</span> Domains</a></li>
        <li class="nav-item"><a href="#/server"><span class="nav-icon">🖥️</span> Server</a></li>
        <li class="nav-item"><a href="#/settings"><span class="nav-icon">🔧</span> Settings</a></li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:16px;">
          <button class="mobile-toggle" id="mobile-toggle">☰</button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <div class="server-badge">
            <span class="pulse-dot"></span>
            <span>Ubuntu 24.04 LTS (Online)</span>
          </div>
          <span style="font-size:13px; color:var(--text-muted); font-weight:500;">👤 <span id="user-badge-name">admin</span></span>
          <button onclick="API.logout()" class="btn btn-secondary btn-sm">🔒 Logout</button>
        </div>
      </header>

      <main class="content-viewport" id="content-area">
        <!-- SPA view components mount here -->
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/services.js"></script>
  <script src="/js/views/deployments.js"></script>
  <script src="/js/views/terminal.js"></script>
  <script src="/js/views/logs.js"></script>
  <script src="/js/views/domains.js"></script>
  <script src="/js/views/server.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
